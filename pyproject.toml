[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jeremie00", email = "99264622+jeremie00@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.1",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "RAG",
]
